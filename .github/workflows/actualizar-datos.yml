# Actualización automática mensual de datos (realidad.uy).
# Corre los scripts de ingesta reproducibles, valida, compila y commitea los
# archivos generados. Si Vercel está conectado al repo, el push redeploya solo.
#
# Qué actualiza: series del Banco Mundial, tasas de seguridad (M. Interior) y
# resultados electorales (Corte Electoral; con asserts contra el escrutinio).
# Los titulares del INE que llegan por prensa los actualiza la tarea local de
# Claude (día 5); acá solo entra lo 100% automatizable con fuente machine-readable.

name: Actualizar datos

on:
  schedule:
    # Día 5 de cada mes, 13:00 UTC (10:00 en Uruguay).
    - cron: "0 13 5 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Los scripts importan módulos .ts (type-stripping nativo de Node ≥23.6).
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Ingesta Banco Mundial (series históricas)
        run: node scripts/ingest/fetch-worldbank.mjs

      - name: Ingesta seguridad (Ministerio del Interior)
        run: node scripts/ingest/fetch-seguridad.mjs

      - name: Ingesta elecciones (Corte Electoral, con verificación de totales)
        run: node scripts/ingest/fetch-elecciones.mjs

      - name: Validar datos
        run: npm run validate:data

      - name: Compilar
        run: npm run build

      - name: Commitear datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/observations/series-banco-mundial.ts src/data/observations/seguridad.ts src/data/elecciones-generadas.ts
          if git diff --cached --quiet; then
            echo "Sin cambios de datos este mes."
          else
            git commit -m "data: actualización automática mensual (Banco Mundial, seguridad, elecciones)"
            git push
          fi
